    <!-- Просмотр карточки из архива DATA: вопрос, ответ, пример, состояние повторения и действия -->
    <div id="card-view-modal" role="dialog" aria-modal="true" aria-labelledby="card-view-question" class="hidden fixed inset-0 z-[118] flex items-end sm:items-center justify-center bg-black/55 backdrop-blur-xs font-sans" onclick="if (event.target === this) closeCardView()" style="touch-action: manipulation; isolation: isolate;">
        <div class="card-view-sheet">
            <div class="flex items-center justify-between gap-2 mb-3">
                <span id="card-view-state" class="card-view-state">NEW</span>
                <button type="button" onclick="closeCardView()" aria-label="Закрыть" class="card-view-close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="card-view-scroll">
                <p class="card-view-label">Вопрос</p>
                <p id="card-view-question" class="card-view-question select-text"></p>
                <p class="card-view-label">Ответ</p>
                <p id="card-view-answer" class="card-view-answer select-text"></p>
                <div id="card-view-example-box" class="hidden">
                    <p class="card-view-label">Пример</p>
                    <p id="card-view-example" class="card-view-example select-text"></p>
                </div>
                <div id="card-view-context-box" class="hidden">
                    <p class="card-view-label">Контекст</p>
                    <p id="card-view-context" class="card-view-context select-text"></p>
                </div>
                <div id="card-view-mnemonic-box" class="hidden mnemonic-box card-view-mnemonic">
                    <p class="card-view-label mnemonic-label">Ассоциация</p>
                    <p id="card-view-mnemonic" class="select-text"></p>
                </div>
                <p id="card-view-meta" class="card-view-meta"></p>
            </div>
            <div class="card-view-actions">
                <button type="button" id="card-view-edit" class="card-view-btn"><span class="material-symbols-outlined">edit</span><span>Править</span></button>
                <button type="button" id="card-view-move" class="card-view-btn"><span class="material-symbols-outlined">drive_file_move</span><span>Перенести</span></button>
                <button type="button" id="card-view-delete" class="card-view-btn card-view-btn-danger"><span class="material-symbols-outlined">delete</span><span>Удалить</span></button>
            </div>
        </div>
    </div>
