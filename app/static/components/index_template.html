    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/css/tailwind.min.css?v=1">
    <style>
        #data-container.selection-mode-active .card-checkbox {
            display: inline-block !important;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        /* Стабильная типографика карточек (17px) без скачков масштаба */
        .dynamic-card-text {
            font-size: 1.0625rem; /* 17px */
            line-height: 1.45;
            font-weight: 600;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        @media (max-width: 480px) {
            .dynamic-card-text {
                font-size: 1.0rem; /* 16px */
                line-height: 1.42;
            }
        }
        .card-scroll-clean {
            scrollbar-width: thin;
            scrollbar-color: rgba(120, 120, 120, 0.25) transparent;
        }
        .card-scroll-clean::-webkit-scrollbar {
            width: 4px;
        }
        .card-scroll-clean::-webkit-scrollbar-thumb {
            background-color: rgba(120, 120, 120, 0.25);
            border-radius: 9999px;
        }
    </style>
    <link rel="stylesheet" href="/css/main.css?v=12">
</head>
