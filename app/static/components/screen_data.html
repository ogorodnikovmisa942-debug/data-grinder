        <!-- Экран архива DATA -->
        <div id="screen-data" class="app-screen hidden flex-1 flex flex-col w-full min-h-0 overflow-hidden pt-md">
            <div class="archive-head shrink-0">
                <div class="archive-title">Карточки <span id="archive-count" class="archive-title-count"></span></div>
                <div class="archive-actions">
                    <button id="bulk-select-toggle" class="archive-action">Выбрать</button>
                    <button id="export-cards-btn" onclick="exportCardsJSON()" class="archive-action" title="Скачать карточки файлом">
                        <span class="material-symbols-outlined">download</span>
                        <span>Скачать</span>
                    </button>
                </div>
            </div>
            <div class="archive-filters shrink-0" id="archive-filter-bar">
                <button data-filter="all" class="archive-filter archive-filter-on">Все</button>
                <button data-filter="review" class="archive-filter">Изучаю</button>
                <button data-filter="new" class="archive-filter">Новые</button>
            </div>
            <div class="archive-search shrink-0 mb-sm">
                <span class="material-symbols-outlined archive-search-icon">search</span>
                <input id="archive-search-input" type="search" inputmode="search" autocomplete="off" spellcheck="false"
                       placeholder="Поиск по вопросам, ответам, примерам… (фразу — в кавычках)"
                       oninput="onArchiveSearchInput(this.value)" class="archive-search-input">
                <button id="archive-search-clear" type="button" onclick="clearArchiveSearch()" class="archive-search-clear hidden" aria-label="Очистить поиск">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="data-container" class="flex-1 overflow-y-auto divide-y divide-outline-variant/30 border-t border-b border-outline-variant/30 pr-1"></div>
            
            <!-- ВСПЛЫВАЮЩИЙ ACTION BAR ДЛЯ МАССОВЫХ ДЕЙСТВИЙ -->
            <div id="bulk-action-bar" class="hidden transition-all duration-300 transform translate-y-full border border-neutral-300 dark:border-neutral-700 bg-surface-container-lowest p-3 my-sm flex items-center justify-between font-mono text-xs shadow-xl shrink-0 rounded-2xl">
                <span id="bulk-selected-count" class="font-bold text-primary">Выбрано: 0</span>
                <div class="flex items-center gap-sm">
                    <div class="relative">
                        <select id="bulk-target-subject" class="bg-surface border border-neutral-300 dark:border-neutral-700 font-bold tracking-tighter text-xs p-1.5 pr-6 text-primary focus:ring-0 cursor-pointer appearance-none uppercase truncate rounded-xl">
                        </select>
                        <span class="material-symbols-outlined absolute right-1.5 top-1/2 -translate-y-1/2 text-[12px] pointer-events-none text-outline">expand_more</span>
                    </div>
                    <button id="bulk-move-btn" onclick="executeBulkMove()" class="bg-primary text-on-primary px-3 py-1.5 border border-primary font-bold hover:bg-transparent hover:text-primary transition-all uppercase rounded-xl">
                        Перенести
                    </button>
                    <button id="bulk-delete-btn" onclick="executeBulkDelete()" class="border border-secondary text-secondary hover:bg-secondary hover:text-on-secondary px-3 py-1.5 font-bold transition-all uppercase rounded-xl">
                        Удалить
                    </button>
                </div>
            </div>
        </div>
