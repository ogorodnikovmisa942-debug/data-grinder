# /etc/nginx/sites-available/datagrinder.conf
# Конфигурация Nginx для сервиса Data Grinder (FastAPI + Telegram Mini App)

server {
    listen 80;
    server_name datagrinder.site www.datagrinder.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name datagrinder.site www.datagrinder.site;

    # SSL сертификаты (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/datagrinder.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/datagrinder.site/privkey.pem;

    # Максимальный размер загружаемого документа (книги, PDF, презентации, лекции)
    client_max_body_size 100M;

    # Таймауты для долгой обработки больших документов ИИ
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # Проксирование запросов на FastAPI Uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
